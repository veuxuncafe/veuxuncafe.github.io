<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}"><script src="{{ '/script.js' | relative_url }}" defer></script>
  <!--
    数学公式渲染。kramdown 的 math_engine（默认 mathjax）会把正文里的 $$...$$
    输出成 \(...\) （行内）和 \[...\]（行间）——这两个恰好就是下面两项的默认值，
    显式写出来是为了将来 MathJax 改默认值时不会静默失配。
    用 tex-chtml 而不是 tex-mml-chtml：本站只写 TeX，不需要 MathML 输入。
  -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <header class="site-header"><div class="container nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}">veuxuncafe<span>.</span></a>
    <nav class="nav" aria-label="主导航"><a href="{{ '/' | relative_url }}">首页</a><a href="{{ '/#articles' | relative_url }}">文章</a><a href="{{ '/research/' | relative_url }}">研究</a><a href="{{ '/about.html' | relative_url }}">关于</a><button class="theme-toggle" type="button" aria-label="切换深色模式">深色模式</button></nav>
  </div></header>
  {{ content }}
  <footer class="site-footer"><div class="container footer-wrap"><p>© {{ site.time | date: '%Y' }} veuxuncafe</p><a href="https://github.com/veuxuncafe" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">-></span></a></div></footer>
</body>
</html>
